```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <a href="index.html" class="logo">ShopEasy</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
</header>

<main class="page-section">

    <h1>Shopping Cart</h1>

    <section class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="cart-items">
                <tr>
                    <td colspan="5">Your cart is empty.</td>
                </tr>
            </tbody>
        </table>
    </section>

    <div class="cart-total">
        Grand Total: <strong id="grand-total">Rs. 0</strong>
    </div>

    <section class="checkout-panel">
        <h2>Checkout Form</h2>

        <form id="checkout-form" novalidate>

            <label for="full-name">Full Name</label>
            <input type="text" id="full-name"
                   required minlength="3">
            <small id="name-error" class="field-error"></small>

            <label for="email">Email</label>
            <input type="email" id="email" required>
            <small id="email-error" class="field-error"></small>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
                   pattern="[0-9+() -]{7,15}" required>
            <small id="phone-error" class="field-error"></small>

            <label for="city">City</label>
            <select id="city" required>
                <option value="">Select City</option>
                <option value="Lahore">Lahore</option>
                <option value="Karachi">Karachi</option>
                <option value="Islamabad">Islamabad</option>
                <option value="Other">Other</option>
            </select>
            <small id="city-error" class="field-error"></small>

            <label for="address">Address</label>
            <textarea id="address" required
                      minlength="10"></textarea>
            <small id="address-error" class="field-error"></small>

            <button type="submit" class="primary-button">
                Validate Checkout
            </button>

            <p id="checkout-message" class="action-message"></p>

        </form>
    </section>

</main>

<footer>
    <p>ShopEasy | Web Engineering Assignment 02</p>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
```
